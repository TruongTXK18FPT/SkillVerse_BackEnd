spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SkillVerseDB}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: update # create, create-drop, update, validate, none
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
      hibernate.jdbc.lob.non_contextual_creation: true
      hibernate.default_batch_fetch_size: 50
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB
      file-size-threshold: 2KB
      location: ${java.io.tmpdir}

  mail:
    host: ${SMTP_HOST:${SPRING_MAIL_HOST:mail49.vietnix.vn}}
    port: ${SMTP_PORT:${SPRING_MAIL_PORT:465}}
    username: ${SMTP_USERNAME:${SPRING_MAIL_USERNAME:noreply@skillverse.vn}}
    password: ${SMTP_PASSWORD:${SPRING_MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}}
          ssl:
            enable: ${SMTP_SSL_ENABLE:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:true}}
            trust: ${SMTP_SSL_TRUST:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:mail49.vietnix.vn}}
            checkserveridentity: ${SMTP_SSL_CHECKSERVERIDENTITY:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY:true}}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}}
            required: ${SMTP_STARTTLS_REQUIRED:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:false}}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:30000}}
          timeout: ${SMTP_TIMEOUT:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:30000}}
          writetimeout: ${SMTP_WRITE_TIMEOUT:${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:30000}}

  jackson:
    # Thời gian, ngày tháng
    date-format: ${SPRING_JACKSON_DATE_FORMAT:yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
    time-zone: ${SPRING_JACKSON_TIME_ZONE:Asia/Ho_Chi_Minh}

    # Cách hiển thị
    serialization:
      indent-output: true # format JSON đẹp dễ đọc
      write-dates-as-timestamps: false # in ISO-8601 thay vì epoch

    deserialization:
      fail-on-unknown-properties: false # bỏ qua field lạ trong JSON input

    mapper:
      accept-case-insensitive-enums: true # cho phép enum không phân biệt hoa/thường

  http:
    client:
      connect-timeout: ${HTTP_CLIENT_CONNECT_TIMEOUT:60s}
      read-timeout: ${HTTP_CLIENT_READ_TIMEOUT:10m}

  # Google OAuth2 Configuration (for Google Login)
  # Works for both dev (localhost:5173) and prod (skillverse.vn)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          google:
            issuer-uri: https://accounts.google.com

  # Spring AI Configuration
  # Using Mistral AI for chatbot and Gemini (via OpenAI-compatible API) for roadmap
  # Simple API key authentication - no Google Cloud setup needed!
  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        enabled: ${MISTRAL_ENABLED:true}
        options:
          model: ${MISTRAL_API_MODEL:mistral-large-latest}
          temperature: ${MISTRAL_API_TEMPERATURE:0.7}
          max-tokens: ${MISTRAL_API_MAX_TOKENS:50000}

    # Custom configuration for AI Study Planner (Mistral Small)
    planner:
      mistral:
        api-key: ${MISTRAL_PLANNER_API_KEY:}
        model: ${MISTRAL_PLANNER_MODEL:mistral-small-latest}

    # OpenAI configuration - using Gemini's OpenAI-compatible endpoint
    openai:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
      fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-2.0-flash}
      chat:
        enabled: ${GEMINI_ENABLED:true}
        options:
          model: ${GEMINI_MODEL:gemini-2.5-flash}
          temperature: ${GEMINI_TEMPERATURE:0.7}
          max-tokens: ${GEMINI_MAX_TOKENS:30000}

    # Retry Configuration (DISABLED - we have manual fallback logic)
    retry:
      max-attempts: 1 # No auto-retry, we handle fallback manually
      on-client-errors: false
  # FPT.AI Speech Configuration (STT/TTS) — nested under ai: to avoid duplicate key
  fpt:
    # API key for FPT.AI (picked from env FPT_AI_KEY if set)
    api-key: ${FPT_AI_KEY:}
    stt:
      # Speech-to-Text endpoint
      endpoint: ${AI_FPT_STT_ENDPOINT:https://api.fpt.ai/hmi/asr/general}
    tts:
      # Text-to-Speech endpoint
      endpoint: ${AI_FPT_TTS_ENDPOINT:https://api.fpt.ai/hmi/tts/v5}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600} # 1 hour in seconds
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800} # 7 days (only issued when rememberMe=true)
  refresh-pepper: ${JWT_REFRESH_PEPPER:skillverse-refresh-pepper}

email:
  from: ${EMAIL_FROM:noreply@skillverse.vn}
  from-name: ${EMAIL_FROM_NAME:SkillVerse}

cors:
  allowed:
    # Development: localhost ports
    # Production: skillverse.vn domains
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:52514,https://skillverse.vn,https://www.skillverse.vn}
    methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    headers: ${CORS_ALLOWED_HEADERS:*}
  allow:
    credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max:
    age: ${CORS_MAX_AGE:3600}

# Meowl Chat Configuration (cute AI assistant with Gemini)
meowl:
  gemini:
    api-key: ${MEOWL_GEMINI_API_KEY}
    api-url: ${MEOWL_GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
    model: ${MEOWL_GEMINI_MODEL:gemini-2.0-flash}
  reminder:
    enabled: ${MEOWL_REMINDER_ENABLED:true}
  notification:
    enabled: ${MEOWL_NOTIFICATION_ENABLED:true}

# Payment Gateway Configuration
payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID:dd239d22-5ff6-4113-bc74-8c71f55147fd}
    api-key: ${PAYOS_API_KEY:9f1a0f8b-fbae-495a-b2f6-52e72ac155ca}
    checksum-key: ${PAYOS_CHECKSUM_KEY:e53324608b59a5614972388adfc79b36b12c2ae5e141470a0d51b82ca6bebc92}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    webhook-url: ${PAYOS_WEBHOOK_URL:http://localhost:8080/api/v1/payments/callback/payos}
  course-purchase:
    success-url: ${COURSE_PURCHASE_SUCCESS_URL:http://localhost:5173/payment/success}
    cancel-url: ${COURSE_PURCHASE_CANCEL_URL:http://localhost:5173/payment/cancel}

# Premium Subscription Configuration
premium:
  plans:
    # Auto-create premium plans on startup (for development)
    auto-create: ${PREMIUM_AUTO_CREATE_PLANS:true}

  subscription:
    # Default subscription settings
    default-currency: VND
    reminder-days-before-expiry: 7
    grace-period-days: 3

    # Student discount settings
    student-email-domains:
      - .edu
      - .edu.vn
      - .ac.uk
      - university.
      - student.

student-verification:
  enabled: ${STUDENT_VERIFICATION_ENABLED:true}
  storage-provider: ${STUDENT_VERIFICATION_STORAGE_PROVIDER:CLOUDINARY}
  cloudinary-folder: ${STUDENT_VERIFICATION_CLOUDINARY_FOLDER:skillverse/student-verification}
  local-storage-path: ${STUDENT_VERIFICATION_LOCAL_STORAGE_PATH:uploads/student-verification}
  max-file-size-bytes: ${STUDENT_VERIFICATION_MAX_FILE_SIZE_BYTES:10485760}
  allowed-mime-types:
    - image/jpeg
    - image/png
  allowed-school-domains:
    - fpt.edu.vn
    - hcmut.edu.vn
    - hcmus.edu.vn
  allowed-domain-suffixes:
    - .edu.vn
  otp:
    length: ${STUDENT_VERIFICATION_OTP_LENGTH:6}
    expiry-minutes: ${STUDENT_VERIFICATION_OTP_EXPIRY_MINUTES:10}
    max-attempts: ${STUDENT_VERIFICATION_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${STUDENT_VERIFICATION_OTP_RESEND_COOLDOWN_SECONDS:60}

# Cloudinary Configuration (Media Upload)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:djv7loilz}
  api-key: ${CLOUDINARY_API_KEY:916727194348317}
  api-secret: ${CLOUDINARY_API_SECRET:hTqjRjjr3UtFz0xZ-72Ux-iPVO0}
  url: ${CLOUDINARY_URL:cloudinary://916727194348317:hTqjRjjr3UtFz0xZ-72Ux-iPVO0@djv7loilz}
  upload:
    folder: skillverse # Base folder for uploads
    resource-type: auto # auto, image, video, raw
    use-filename: true
    unique-filename: true
    overwrite: false
removebg:
  api-key: ${REMOVE_BG_API_KEY}
# Portfolio CV Generation AI Configuration (separate Mistral API key)
portfolio:
  ai:
    mistral:
      api-key: ${PORTFOLIO_MISTRAL_API_KEY}
      api-url: ${PORTFOLIO_MISTRAL_API_BASE_URL:https://api.mistral.ai/v1/chat/completions}
      model: ${PORTFOLIO_MISTRAL_API_MODEL:mistral-large-latest}
      enabled: ${PORTFOLIO_MISTRAL_ENABLED:true}
      timeout: ${PORTFOLIO_MISTRAL_API_TIMEOUT:30000}
      max-tokens: ${PORTFOLIO_MISTRAL_API_MAX_TOKENS:30000}
      temperature: ${PORTFOLIO_MISTRAL_API_TEMPERATURE:0.7}

# Student Learning Report AI Configuration (separate Mistral API key)
skillverse:
  ai:
    learning-report:
      api-key: ${LEARNING_REPORT_KEY:}
      model: ${LEARNING_REPORT_MODEL:mistral-large-latest}
      enabled: ${LEARNING_REPORT_ENABLED:true}
      max-tokens: ${LEARNING_REPORT_MAX_TOKENS:30000}
      temperature: ${LEARNING_REPORT_TEMPERATURE:0.7}

    # AI Generate Test Configuration (separate Mistral API key for guided journey)
    generate-test:
      api-key: ${AI_GENERATE_TEST_KEY:}
      model: ${AI_GENERATE_TEST_MODEL:mistral-small-latest}
      enabled: ${AI_GENERATE_TEST_ENABLED:true}
      max-tokens: ${AI_GENERATE_TEST_MAX_TOKENS:8000}
      temperature: ${AI_GENERATE_TEST_TEMPERATURE:0.7}
      timeout-ms: ${AI_GENERATE_TEST_TIMEOUT:300000}

    # AI Candidate Search Configuration (separate Mistral API key for recruiter search)
    search:
      api-key: ${AI_SEARCH_KEY:}
      model: ${AI_SEARCH_MODEL:mistral-large-latest}
      enabled: ${AI_SEARCH_ENABLED:true}
      max-tokens: ${AI_SEARCH_MAX_TOKENS:30000}
      temperature: ${AI_SEARCH_TEMPERATURE:0.7}
      timeout: ${AI_SEARCH_TIMEOUT:30000}
      max-requests-per-minute: ${AI_SEARCH_MAX_REQUESTS_PER_MINUTE:10}
      max-tokens-per-day: ${AI_SEARCH_MAX_TOKENS_PER_DAY:100000}
      cache-enabled: ${AI_SEARCH_CACHE_ENABLED:true}
      cache-ttl-minutes: ${AI_SEARCH_CACHE_TTL_MINUTES:60}

    # Local AI VPS Configuration (first-tier before cloud APIs)
    local:
      enabled: ${LOCAL_AI_ENABLED:false}
      base-url: ${LOCAL_AI_BASE_URL:}
      model: ${LOCAL_AI_MODEL:qwen3.5:27b}
      connect-timeout-ms: ${LOCAL_AI_CONNECT_TIMEOUT_MS:1500}
      http-timeout-ms: ${LOCAL_AI_HTTP_TIMEOUT_MS:30000}
      queue-wait-ms: ${LOCAL_AI_QUEUE_WAIT_MS:8000}
      queue-max-pending: ${LOCAL_AI_QUEUE_MAX_PENDING:2}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}

# Assignment AI Grading Configuration (separate Mistral API key for auto-grading)
assignment_ai:
  api-key: ${ASSIGNMENT_AI_API_KEY:}
  model: ${ASSIGNMENT_AI_MODEL:mistral-large-latest}
  temperature: ${ASSIGNMENT_AI_TEMPERATURE:0.7}
  max-tokens: ${ASSIGNMENT_AI_MAX_TOKENS:30000}
  enabled: ${ASSIGNMENT_AI_ENABLED:true}

# FPT.AI Speech Configuration — now nested under spring.ai.fpt
# (moved from duplicate ai: key to avoid YAML override)

server:
  port: ${SERVER_PORT:8080}

# Course revision feature flags
app:
  course:
    revision:
      read-enabled: ${APP_COURSE_REVISION_READ_ENABLED:true}
      write-enabled: ${APP_COURSE_REVISION_WRITE_ENABLED:true}
      approval-enabled: ${APP_COURSE_REVISION_APPROVAL_ENABLED:true}
      submit-change-check-mode: ${APP_COURSE_REVISION_SUBMIT_CHANGE_CHECK_MODE:ENFORCE}
      require-source-baseline: ${APP_COURSE_REVISION_REQUIRE_SOURCE_BASELINE:false}
      require-source-baseline-rollout-percent: ${APP_COURSE_REVISION_REQUIRE_SOURCE_BASELINE_ROLLOUT_PERCENT:100}
      max-content-snapshot-bytes: ${APP_COURSE_REVISION_MAX_CONTENT_SNAPSHOT_BYTES:1048576}
      snapshot-hash-latency-warn-ms: ${APP_COURSE_REVISION_SNAPSHOT_HASH_LATENCY_WARN_MS:200}
      learning-revision-backfill:
        enabled: ${APP_COURSE_REVISION_LEARNING_REVISION_BACKFILL_ENABLED:false}
        batch-size: ${APP_COURSE_REVISION_LEARNING_REVISION_BACKFILL_BATCH_SIZE:1000}
        max-batches-per-run: ${APP_COURSE_REVISION_LEARNING_REVISION_BACKFILL_MAX_BATCHES_PER_RUN:3}
        fixed-delay-ms: ${APP_COURSE_REVISION_LEARNING_REVISION_BACKFILL_FIXED_DELAY_MS:60000}

quiz-attempt-session:
  enabled: ${APP_COURSE_QUIZ_ATTEMPT_SESSION_ENABLED:true}

# Firebase Configuration (FCM for Mobile Push Notifications)
firebase:
  project-id: ${FIREBASE_PROJECT_ID:skillverse-app}
  credentials:
    json-base64: ${FIREBASE_CREDENTIALS_JSON_BASE64:}
  ttl-minutes: ${APP_COURSE_QUIZ_ATTEMPT_SESSION_TTL_MINUTES:30}

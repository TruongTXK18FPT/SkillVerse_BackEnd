name: ☕ Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  JWT_REFRESH_PEPPER: ${{ secrets.JWT_REFRESH_PEPPER }}
  JWT_ACCESS_TOKEN_EXPIRATION: 3600
  JWT_REFRESH_TOKEN_EXPIRATION: 86400

  # Google OAuth2 Configuration
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  # Email Configuration
  SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
  SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}

  # SMTP (Primary) Configuration
  SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

  # Gemini AI Configuration
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # Mistral AI Configuration
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_PLANNER_API_KEY: ${{ secrets.MISTRAL_PLANNER_API_KEY }}
  MISTRAL_PLANNER_MODEL: mistral-small-latest

  # Meowl Chat Configuration
  MEOWL_GEMINI_API_KEY: ${{ secrets.MEOWL_GEMINI_API_KEY }}

  # Portfolio CV Generation AI Configuration
  PORTFOLIO_MISTRAL_API_KEY: ${{ secrets.PORTFOLIO_MISTRAL_API_KEY }}

  # Student Learning Report AI Configuration
  LEARNING_REPORT_KEY: ${{ secrets.LEARNING_REPORT_KEY }}

  # AI Generate Test Key Configuration
  AI_GENERATE_TEST_KEY: ${{ secrets.AI_GENERATE_TEST_KEY }}

  # AI Search Configuration
  AI_SEARCH_KEY: ${{ secrets.AI_SEARCH_KEY }}

  # Assignment AI Grading Configuration
  ASSIGNMENT_AI_API_KEY: ${{ secrets.ASSIGNMENT_AI_API_KEY }}

  # Payment Gateway Configuration (PayOS)
  PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
  PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
  PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}

  # Cloudinary Configuration
  CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
  CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

  # FPT.AI Speech Configuration
  FPT_AI_KEY: ${{ secrets.FPT_AI_KEY }}

  # Remove.bg Configuration
  REMOVE_BG_API_KEY: ${{ secrets.REMOVE_BG_API_KEY }}

  # Firebase Cloud Messaging Configuration
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}

jobs:
  # Job 1: Code Quality & Testing
  quality-check:
    name: 🔍 Code Quality & Testing
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      - name: 🔐 Make mvnw executable
        run: chmod +x mvnw

      - name: 📦 Compile & Package
        run: |
          ./mvnw clean compile -q
          ./mvnw package -DskipTests -q

      - name: 🧪 Run Unit Tests
        run: |
          # Run tests with test profile (uses application-test.yml with H2 + mock AI config)
          ./mvnw test -Dspring.profiles.active=test

      - name: 📊 Test Coverage Report
        run: |
          ./mvnw jacoco:report
        continue-on-error: true

      - name: 📈 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: |
            ./target/surefire-reports/
            ./target/site/jacoco/
          retention-days: 7

      - name: 📦 Upload JAR Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-jar-${{ github.sha }}
          path: ./target/*.jar
          retention-days: 7

  # Job 2: Security & Dependency Check
  security-scan:
    name: 🔒 Security & Dependency Scan
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      - name: 🔐 Make mvnw executable
        run: chmod +x mvnw

      - name: 🔍 OWASP Dependency Check
        run: |
          ./mvnw org.owasp:dependency-check-maven:check
        continue-on-error: true

  # Job 3: API Documentation & Swagger
  # Uses ci profile (H2 in-memory, no Redis, no production DB)
  # Self-contained — no external dependencies, fast startup
  api-docs:
    name: 📚 API Documentation
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      - name: 🔐 Make mvnw executable
        run: chmod +x mvnw

      - name: 🏗️ Build Application
        run: |
          ./mvnw clean package -DskipTests -q

      - name: 🚀 Start Application for API Docs
        run: |
          echo "🚀 Starting application with ci profile (H2 in-memory, no Redis/production DB)..."

          # Start application with ci profile — self-contained, no external deps
          # Force-exclude Mail auto-config as backup in case application-ci.yml is not loaded
          java -jar target/*.jar \
            --spring.profiles.active=ci \
            --server.port=8080 \
            --server.address=0.0.0.0 \
            --spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration \
            > app.log 2>&1 &

          APP_PID=$!
          echo "📝 Application PID: $APP_PID"
          echo $APP_PID > app.pid

          # Wait for startup (ci profile starts faster since no DB/Redis)
          echo "⏳ Waiting for application startup (up to 2 minutes)..."
          HEALTH_CHECK_PASSED=false

          for i in {1..24}; do
            # Check if process is still running
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "❌ Application process died! Last 50 lines of logs:"
              tail -n 50 app.log
              exit 1
            fi

            # Try health check
            if curl -f -s http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✅ Application is ready!"
              HEALTH_CHECK_PASSED=true
              break
            fi

            echo "⏳ Not ready yet, waiting 5 seconds... ($i/24)"
            sleep 5
          done

          # Verify health check passed
          if [ "$HEALTH_CHECK_PASSED" = false ]; then
            echo "❌ Health check failed after 2 minutes. Application logs:"
            cat app.log
            echo ""
            echo "Process status:"
            ps aux | grep java || echo "(no java process found)"
            echo ""
            echo "Port status:"
            netstat -tlnp 2>/dev/null | grep 8080 || echo "Port 8080 not listening"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi

          # Display successful health check
          echo "🏥 Health check response:"
          curl -s http://localhost:8080/actuator/health | jq '.' || curl -s http://localhost:8080/actuator/health

          # Download OpenAPI spec
          echo "📥 Downloading API documentation..."
          if curl -f -s http://localhost:8080/v3/api-docs > api-docs.json; then
            echo "✅ Downloaded api-docs.json ($(wc -c < api-docs.json) bytes)"
          else
            echo "⚠️ Failed to download api-docs.json"
          fi

          if curl -f -s http://localhost:8080/v3/api-docs.yaml > api-docs.yaml; then
            echo "✅ Downloaded api-docs.yaml ($(wc -c < api-docs.yaml) bytes)"
          else
            echo "⚠️ Failed to download api-docs.yaml"
          fi

          # Stop application gracefully
          echo "🛑 Stopping application..."
          kill $APP_PID 2>/dev/null || true
          sleep 3
          kill -9 $APP_PID 2>/dev/null || true

      - name: 📊 Upload API Documentation
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: api-docs-${{ github.sha }}
          path: |
            ./api-docs.json
            ./api-docs.yaml
          retention-days: 30

  # Job 4: Docker Build (on main branch)
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Make mvnw executable
        run: chmod +x mvnw

      - name: 🏗️ Build JAR
        run: |
          ./mvnw clean package -DskipTests -q

      - name: 🐳 Build Docker Image
        run: |
          docker build -t skillverse-backend:${{ github.sha }} .
          docker tag skillverse-backend:${{ github.sha }} skillverse-backend:latest
          docker tag skillverse-backend:${{ github.sha }} skillverse-backend:v1

      - name: 🧪 Test Docker Image
        run: |
          # Pull Redis with retry logic & fallback
          echo "🔄 Pulling Redis image..."
          REDIS_IMAGE="redis:7-alpine"
          FALLBACK_IMAGE="public.ecr.aws/docker/library/redis:7-alpine"

          PULLED=false
          for i in {1..3}; do
            if docker pull $REDIS_IMAGE; then
              echo "✅ Redis image pulled from Docker Hub."
              PULLED=true
              break
            fi
            echo "⚠️ Docker Hub pull failed (attempt $i/3). Retrying..."
            sleep 5
          done

          if [ "$PULLED" = false ]; then
             echo "⚠️ Docker Hub failed. Switching to public mirror..."
             if docker pull $FALLBACK_IMAGE; then
               echo "✅ Redis image pulled from mirror."
               docker tag $FALLBACK_IMAGE $REDIS_IMAGE
             else
               echo "❌ Failed to pull Redis from both Docker Hub and mirror."
               exit 1
             fi
          fi

          # Start Redis for the test
          echo "🚀 Starting Redis container..."
          docker run -d --name test-redis \
            redis:7-alpine redis-server --appendonly yes --requirepass secret_password

          # Wait for Redis to be ready
          sleep 5

          # Start an isolated PostgreSQL database for the image smoke test.
          # Do not depend on the shared VPS database here; GitHub-hosted runners
          # may not be allowed through the database firewall.
          TEST_DB_PASSWORD="${DB_PASSWORD:-secret_password}"
          echo "Starting PostgreSQL container..."
          docker run -d --name test-db \
            -e POSTGRES_USER=skillverse_user \
            -e POSTGRES_PASSWORD="${TEST_DB_PASSWORD}" \
            -e POSTGRES_DB=skillverse_db \
            postgres:17-alpine

          echo "Waiting for PostgreSQL to be ready..."
          POSTGRES_CLIENT_IMAGE="postgres:17-alpine"
          DB_READY=false
          for i in {1..60}; do
            DB_STATE=$(docker run --rm \
              --link test-db:test-db \
              -e PGPASSWORD="${TEST_DB_PASSWORD}" \
              "$POSTGRES_CLIENT_IMAGE" \
              psql -h test-db -p 5432 -U skillverse_user -d skillverse_db \
              -tAc "SELECT CASE WHEN pg_is_in_recovery() THEN 'recovery' ELSE 'ready' END" 2>/dev/null || true)

            if [ "$DB_STATE" = "ready" ]; then
              echo "PostgreSQL is ready."
              DB_READY=true
              break
            fi

            echo "PostgreSQL not ready yet (state: ${DB_STATE:-unreachable}), waiting 5 seconds... ($i/60)"
            sleep 5
          done

          if [ "$DB_READY" = false ]; then
            echo "PostgreSQL did not become writable within 5 minutes."
            docker stop test-redis test-db || true
            docker rm test-redis test-db || true
            exit 1
          fi

          # Start backend container with all environment variables
          echo "🚀 Starting backend container..."
          docker run -d --name test-backend \
            -p 8080:8080 \
            --link test-redis:redis \
            --link test-db:test-db \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e LOCAL_AI_ENABLED=false \
            -e APP_DATABASE_SCHEMA_FIXER_ENABLED=false \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://test-db:5432/skillverse_db \
            -e SPRING_DATASOURCE_USERNAME=skillverse_user \
            -e SPRING_DATASOURCE_PASSWORD="${TEST_DB_PASSWORD}" \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            -e SPRING_DATA_REDIS_HOST=redis \
            -e SPRING_DATA_REDIS_PORT=6379 \
            -e SPRING_DATA_REDIS_PASSWORD=secret_password \
            -e FPT_AI_KEY="${FPT_AI_KEY}" \
            -e JWT_SECRET="${JWT_SECRET}" \
            -e JWT_REFRESH_PEPPER="${JWT_REFRESH_PEPPER}" \
            -e JWT_ACCESS_TOKEN_EXPIRATION="${JWT_ACCESS_TOKEN_EXPIRATION}" \
            -e JWT_REFRESH_TOKEN_EXPIRATION="${JWT_REFRESH_TOKEN_EXPIRATION}" \
            -e GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            -e GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
            -e SPRING_MAIL_USERNAME="${SPRING_MAIL_USERNAME}" \
            -e SPRING_MAIL_PASSWORD="${SPRING_MAIL_PASSWORD}" \
            -e SMTP_USERNAME="${SMTP_USERNAME}" \
            -e SMTP_PASSWORD="${SMTP_PASSWORD}" \
            -e GEMINI_API_KEY="${GEMINI_API_KEY}" \
            -e MISTRAL_API_KEY="${MISTRAL_API_KEY}" \
            -e MISTRAL_PLANNER_API_KEY="${MISTRAL_PLANNER_API_KEY}" \
            -e MEOWL_GEMINI_API_KEY="${MEOWL_GEMINI_API_KEY}" \
            -e PORTFOLIO_MISTRAL_API_KEY="${PORTFOLIO_MISTRAL_API_KEY}" \
            -e LEARNING_REPORT_KEY="${LEARNING_REPORT_KEY}" \
            -e AI_GENERATE_TEST_KEY="${AI_GENERATE_TEST_KEY}" \
            -e PAYOS_CLIENT_ID="${PAYOS_CLIENT_ID}" \
            -e PAYOS_API_KEY="${PAYOS_API_KEY}" \
            -e PAYOS_CHECKSUM_KEY="${PAYOS_CHECKSUM_KEY}" \
            -e CLOUDINARY_CLOUD_NAME="${CLOUDINARY_CLOUD_NAME}" \
            -e CLOUDINARY_API_KEY="${CLOUDINARY_API_KEY}" \
            -e CLOUDINARY_API_SECRET="${CLOUDINARY_API_SECRET}" \
            -e CLOUDINARY_URL="${CLOUDINARY_URL}" \
            -e REMOVE_BG_API_KEY="${REMOVE_BG_API_KEY}" \
            -e AI_SEARCH_KEY="${AI_SEARCH_KEY}" \
            -e FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            -e FIREBASE_CREDENTIALS_JSON_BASE64="${FIREBASE_CREDENTIALS_JSON_BASE64}" \
            skillverse-backend:${{ github.sha }}
            
          echo "⏳ Waiting for application to start..."

          # Enhanced health check with retry logic
          HEALTH_CHECK_PASSED=false
          for i in {1..30}; do
            echo "Health check attempt $i/30..."
            
            # Check if container is still running
            if ! docker ps | grep -q test-backend; then
              echo "❌ Container stopped unexpectedly!"
              docker ps -a --filter name=test-backend
              docker logs test-backend --tail 100
              docker stop test-backend test-redis test-db || true
              docker rm test-backend test-redis test-db || true
              exit 1
            fi
            
            # Try health check
            if curl -f -s http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✅ Health check passed!"
              HEALTH_CHECK_PASSED=true
              break
            fi
            
            echo "⏳ Not ready yet, waiting 5 seconds... ($i/30)"
            sleep 5
          done

          # Verify health check passed
          if [ "$HEALTH_CHECK_PASSED" = false ]; then
            echo "❌ Health check failed after 2.5 minutes"
            echo "📋 Container status:"
            docker ps -a --filter name=test-backend
            echo ""
            echo "📋 Application logs (full):"
            docker logs test-backend || true
            echo ""
            echo "📋 Environment variables passed to container:"
            docker inspect --format='{{json .Config.Env}}' test-backend || true
            echo ""
            echo "📋 Port status:"
            netstat -tlnp 2>/dev/null | grep :8080 || echo "Port 8080 not listening"
            docker stop test-backend test-redis test-db || true
            docker rm test-backend test-redis test-db || true
            exit 1
          fi

          # Display health response
          echo "🏥 Health check response:"
          curl -s http://localhost:8080/actuator/health | jq '.' || curl -s http://localhost:8080/actuator/health

          # Cleanup
          echo "🧹 Cleaning up containers..."
          docker stop test-backend test-redis test-db || true
          docker rm test-backend test-redis test-db || true
          echo "✅ Docker test completed successfully!"

  # Job 5: Deploy to VPS
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan, api-docs, docker-build]
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🔧 Deploy to VPS
        run: |
          echo "🔨 Creating complete .env file from secrets..."
          # Use proper quoting to handle special characters in secret values
          cat > .env << 'ENVFILE'
          SPRING_PROFILES_ACTIVE=docker
          SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/skillverse_db
          SPRING_DATASOURCE_USERNAME=skillverse_user
          SPRING_JPA_HIBERNATE_DDL_AUTO=update
          SPRING_JPA_SHOW_SQL=false
          REDIS_HOST=redis
          REDIS_PORT=6379
          ENVFILE

          # Append secrets with proper escaping (values may contain special chars)
          echo "SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}'" >> .env
          echo "REDIS_PASSWORD='${{ secrets.REDIS_PASSWORD }}'" >> .env
          echo "JWT_SECRET='${{ secrets.JWT_SECRET }}'" >> .env
          echo "JWT_REFRESH_PEPPER='${{ secrets.JWT_REFRESH_PEPPER }}'" >> .env
          echo "JWT_ACCESS_TOKEN_EXPIRATION='${{ env.JWT_ACCESS_TOKEN_EXPIRATION }}'" >> .env
          echo "JWT_REFRESH_TOKEN_EXPIRATION='${{ env.JWT_REFRESH_TOKEN_EXPIRATION }}'" >> .env
          echo "GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}'" >> .env
          echo "GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}'" >> .env
          echo "SPRING_MAIL_USERNAME='${{ secrets.SPRING_MAIL_USERNAME }}'" >> .env
          echo "SPRING_MAIL_PASSWORD='${{ secrets.SPRING_MAIL_PASSWORD }}'" >> .env
          echo "SMTP_USERNAME='${{ secrets.SMTP_USERNAME }}'" >> .env
          echo "SMTP_PASSWORD='${{ secrets.SMTP_PASSWORD }}'" >> .env

          # FPT.AI Speech Configuration
          echo "FPT_AI_KEY='${{ secrets.FPT_AI_KEY }}'" >> .env

          echo "GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}'" >> .env
          echo "MISTRAL_API_KEY='${{ secrets.MISTRAL_API_KEY }}'" >> .env
          echo "MISTRAL_PLANNER_API_KEY='${{ secrets.MISTRAL_PLANNER_API_KEY }}'" >> .env
          echo "MEOWL_GEMINI_API_KEY='${{ secrets.MEOWL_GEMINI_API_KEY }}'" >> .env
          echo "PORTFOLIO_MISTRAL_API_KEY='${{ secrets.PORTFOLIO_MISTRAL_API_KEY }}'" >> .env
          echo "LEARNING_REPORT_KEY='${{ secrets.LEARNING_REPORT_KEY }}'" >> .env
          echo "AI_GENERATE_TEST_KEY='${{ secrets.AI_GENERATE_TEST_KEY }}'" >> .env
          echo "PAYOS_CLIENT_ID='${{ secrets.PAYOS_CLIENT_ID }}'" >> .env
          echo "PAYOS_API_KEY='${{ secrets.PAYOS_API_KEY }}'" >> .env
          echo "PAYOS_CHECKSUM_KEY='${{ secrets.PAYOS_CHECKSUM_KEY }}'" >> .env
          echo "CLOUDINARY_CLOUD_NAME='${{ secrets.CLOUDINARY_CLOUD_NAME }}'" >> .env
          echo "CLOUDINARY_API_KEY='${{ secrets.CLOUDINARY_API_KEY }}'" >> .env
          echo "CLOUDINARY_API_SECRET='${{ secrets.CLOUDINARY_API_SECRET }}'" >> .env
          echo "CLOUDINARY_URL='${{ secrets.CLOUDINARY_URL }}'" >> .env
          echo "REMOVE_BG_API_KEY='${{ secrets.REMOVE_BG_API_KEY }}'" >> .env
          echo "AI_SEARCH_KEY='${{ secrets.AI_SEARCH_KEY }}'" >> .env
          echo "ASSIGNMENT_AI_API_KEY='${{ secrets.ASSIGNMENT_AI_API_KEY }}'" >> .env
          echo "FIREBASE_PROJECT_ID='${{ secrets.FIREBASE_PROJECT_ID }}'" >> .env
          echo "FIREBASE_CREDENTIALS_JSON_BASE64='${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}'" >> .env
          echo "LOCAL_AI_ENABLED='${{ secrets.LOCAL_AI_ENABLED || 'false' }}'" >> .env
          echo "LOCAL_AI_BASE_URL='${{ secrets.LOCAL_AI_BASE_URL || '' }}'" >> .env
          echo "LOCAL_AI_MODEL='${{ secrets.LOCAL_AI_MODEL || 'qwen3.5:27b' }}'" >> .env
          echo "LOCAL_AI_CONNECT_TIMEOUT_MS='${{ secrets.LOCAL_AI_CONNECT_TIMEOUT_MS || '1500' }}'" >> .env
          echo "LOCAL_AI_HTTP_TIMEOUT_MS='${{ secrets.LOCAL_AI_HTTP_TIMEOUT_MS || '25000' }}'" >> .env
          echo "LOCAL_AI_QUEUE_WAIT_MS='${{ secrets.LOCAL_AI_QUEUE_WAIT_MS || '4000' }}'" >> .env
          echo "LOCAL_AI_QUEUE_MAX_PENDING='${{ secrets.LOCAL_AI_QUEUE_MAX_PENDING || '2' }}'" >> .env

          # Debug: Verify critical secrets are set (without exposing values)
          echo "🔍 Verifying critical environment variables..."
          if [ -z "${{ secrets.MISTRAL_API_KEY }}" ]; then
            echo "❌ WARNING: MISTRAL_API_KEY secret is empty or not set!"
          else
            echo "✅ MISTRAL_API_KEY is set (length: ${#MISTRAL_API_KEY})"
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "❌ WARNING: GEMINI_API_KEY secret is empty or not set!"
          else
            echo "✅ GEMINI_API_KEY is set"
          fi
          if [ -z "${{ secrets.CLOUDINARY_CLOUD_NAME }}" ]; then
            echo "⚠️ WARNING: CLOUDINARY_CLOUD_NAME not set - will use default"
          else
            echo "✅ CLOUDINARY_CLOUD_NAME is set"
          fi
          if [ -z "${{ secrets.PAYOS_CLIENT_ID }}" ]; then
            echo "⚠️ WARNING: PAYOS_CLIENT_ID not set - will use default"
          else
            echo "✅ PAYOS_CLIENT_ID is set"
          fi

          echo "📤 Copying .env to VPS..."
          scp -o StrictHostKeyChecking=no .env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/.env

          echo " Connecting to VPS to deploy..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            echo "📂 Navigating to project directory..."
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "🐳 Docker Deployment..."
            
            # Source .env file to load environment variables
            echo "📋 Loading environment variables from .env..."
            set -a
            source .env
            set +a
            
            # Debug: Verify critical variables are loaded
            echo "🔍 Verifying loaded environment variables..."
            [ -n "$MISTRAL_API_KEY" ] && echo "✅ MISTRAL_API_KEY loaded" || echo "❌ MISTRAL_API_KEY missing"
            [ -n "$GEMINI_API_KEY" ] && echo "✅ GEMINI_API_KEY loaded" || echo "❌ GEMINI_API_KEY missing"
            [ -n "$CLOUDINARY_CLOUD_NAME" ] && echo "✅ CLOUDINARY_CLOUD_NAME loaded" || echo "❌ CLOUDINARY_CLOUD_NAME missing"
            [ -n "$ASSIGNMENT_AI_API_KEY" ] && echo "✅ ASSIGNMENT_AI_API_KEY loaded" || echo "❌ ASSIGNMENT_AI_API_KEY missing"
            
            # Stop and remove old backend container (both compose and standalone)
            docker compose stop backend 2>/dev/null || true
            docker compose rm -f backend 2>/dev/null || true
            docker stop skillverse-backend 2>/dev/null || true
            docker rm -f skillverse-backend 2>/dev/null || true
            
            # Remove old backend images to force rebuild/update
            docker images | grep backend | awk '{print $3}' | xargs -r docker rmi -f 2>/dev/null || true
            
            # Build new backend image
            docker build -t skillverse-backend:v1 .
            
            # Get the docker compose network name
            NETWORK_NAME=$(docker network ls --filter name=skillverse -q | head -1)
            if [ -z "$NETWORK_NAME" ]; then
              echo "Creating network..."
              docker network create skillverse_default || true
              NETWORK_NAME="skillverse_default"
            else
              NETWORK_NAME=$(docker network ls --filter name=skillverse --format '{{.Name}}' | head -1)
            fi
            echo "Using network: $NETWORK_NAME"

            # Wait for the local PostgreSQL container to be writable before starting Hibernate.
            if docker ps --format '{{.Names}}' | grep -qx skillverse-db; then
              echo "Waiting for PostgreSQL container to be ready..."
              DB_READY=false
              for i in {1..60}; do
                DB_STATE=$(docker exec \
                  -e PGPASSWORD="${SPRING_DATASOURCE_PASSWORD}" \
                  skillverse-db \
                  psql -U "${SPRING_DATASOURCE_USERNAME:-skillverse_user}" -d skillverse_db \
                  -tAc "SELECT CASE WHEN pg_is_in_recovery() THEN 'recovery' ELSE 'ready' END" 2>/dev/null || true)

                if [ "$DB_STATE" = "ready" ]; then
                  echo "PostgreSQL container is ready."
                  DB_READY=true
                  break
                fi

                echo "PostgreSQL not ready yet (state: ${DB_STATE:-unreachable}), waiting 5 seconds... ($i/60)"
                sleep 5
              done

              if [ "$DB_READY" = false ]; then
                echo "PostgreSQL container did not become writable within 5 minutes."
                exit 1
              fi
            fi
            
            # Start backend with explicit environment variables using docker run
            # This guarantees env vars are passed to the container
            echo "🚀 Starting backend container with explicit env vars..."
            docker run -d \
              --name skillverse-backend \
              --network $NETWORK_NAME \
              -p 8080:8080 \
              --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=docker \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              -e SPRING_DATA_REDIS_HOST=redis \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e REDIS_PASSWORD="$REDIS_PASSWORD" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e JWT_ACCESS_TOKEN_EXPIRATION="$JWT_ACCESS_TOKEN_EXPIRATION" \
              -e JWT_REFRESH_TOKEN_EXPIRATION="$JWT_REFRESH_TOKEN_EXPIRATION" \
              -e JWT_REFRESH_PEPPER="$JWT_REFRESH_PEPPER" \
              -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              -e SPRING_MAIL_USERNAME="$SPRING_MAIL_USERNAME" \
              -e SPRING_MAIL_PASSWORD="$SPRING_MAIL_PASSWORD" \
              -e SMTP_USERNAME="$SMTP_USERNAME" \
              -e SMTP_PASSWORD="$SMTP_PASSWORD" \
              -e FPT_AI_KEY="$FPT_AI_KEY" \
              -e MISTRAL_API_KEY="$MISTRAL_API_KEY" \
              -e MISTRAL_PLANNER_API_KEY="$MISTRAL_PLANNER_API_KEY" \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              -e MEOWL_GEMINI_API_KEY="$MEOWL_GEMINI_API_KEY" \
              -e PORTFOLIO_MISTRAL_API_KEY="$PORTFOLIO_MISTRAL_API_KEY" \
              -e LEARNING_REPORT_KEY="$LEARNING_REPORT_KEY" \
              -e AI_GENERATE_TEST_KEY="$AI_GENERATE_TEST_KEY" \
              -e CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME" \
              -e CLOUDINARY_API_KEY="$CLOUDINARY_API_KEY" \
              -e CLOUDINARY_API_SECRET="$CLOUDINARY_API_SECRET" \
              -e CLOUDINARY_URL="$CLOUDINARY_URL" \
              -e REMOVE_BG_API_KEY="$REMOVE_BG_API_KEY" \
              -e AI_SEARCH_KEY="$AI_SEARCH_KEY" \
              -e PAYOS_CLIENT_ID="$PAYOS_CLIENT_ID" \
              -e PAYOS_API_KEY="$PAYOS_API_KEY" \
              -e PAYOS_CHECKSUM_KEY="$PAYOS_CHECKSUM_KEY" \
              -e FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
              -e FIREBASE_CREDENTIALS_JSON_BASE64="$FIREBASE_CREDENTIALS_JSON_BASE64" \
              -e ASSIGNMENT_AI_API_KEY="$ASSIGNMENT_AI_API_KEY" \
              -e LOCAL_AI_ENABLED="$LOCAL_AI_ENABLED" \
              -e LOCAL_AI_BASE_URL="$LOCAL_AI_BASE_URL" \
              -e LOCAL_AI_MODEL="$LOCAL_AI_MODEL" \
              -e LOCAL_AI_CONNECT_TIMEOUT_MS="$LOCAL_AI_CONNECT_TIMEOUT_MS" \
              -e LOCAL_AI_HTTP_TIMEOUT_MS="$LOCAL_AI_HTTP_TIMEOUT_MS" \
              -e LOCAL_AI_QUEUE_WAIT_MS="$LOCAL_AI_QUEUE_WAIT_MS" \
              -e LOCAL_AI_QUEUE_MAX_PENDING="$LOCAL_AI_QUEUE_MAX_PENDING" \
              skillverse-backend:v1
            
            echo "⏳ Waiting for backend to start..."
            sleep 30
            
            # Check backend health with retries
            echo "🏥 Checking backend health..."
            MAX_RETRIES=6
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "⏳ Health check attempt $RETRY_COUNT/$MAX_RETRIES failed, waiting 10s..."
              sleep 10
            done
            
            # Final check
            if ! curl -sf http://localhost:8080/actuator/health; then
              echo "❌ Backend health check failed after $MAX_RETRIES attempts!"
              echo ""
              echo "📋 Container status:"
              docker ps -a | grep skillverse-backend || true
              echo ""
              echo "📋 Full startup logs:"
              docker logs skillverse-backend 2>&1 | head -200
              echo ""
              echo "📋 Last 50 lines:"
              docker logs skillverse-backend --tail=50 2>&1
              exit 1
            fi
            
            echo "✅ Backend deployed successfully and healthy!"
            
            # Clean up unused images
            docker system prune -f
          ENDSSH

  # Job 6: Deployment Status
  deployment-status:
    name: 📊 Deployment Status
    runs-on: ubuntu-latest
    needs: [quality-check, security-scan, api-docs, docker-build, deploy]
    if: always()

    steps:
      - name: 📊 Report Status
        run: |
          echo "## ☕ Backend CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Check**: ${{ needs.quality-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Docs**: ${{ needs.api-docs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Build**: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request' && (failure() || success())
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.quality-check.result }}' === 'success' && 
                          '${{ needs.security-scan.result }}' === 'success' ? '✅' : '❌';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} **Backend CI/CD Results**
              
              - Quality Check: ${{ needs.quality-check.result }}
              - Security Scan: ${{ needs.security-scan.result }}
              - API Documentation: ${{ needs.api-docs.result }}
              - Docker Build: ${{ needs.docker-build.result }}
              - Deployment: ${{ needs.deploy.result }}
              - Commit: \`${{ github.sha }}\`
              
              ${status === '❌' ? '⚠️ Please fix the issues before merging.' : '🎉 All checks passed! Ready to merge.'}`
            })
